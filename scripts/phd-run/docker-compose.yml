# Compose UNICO do fluxo PhD (pool + AOI vetorial). Mesmo motor p/ todas as redes.
# Os *_HOST sao injetados por run.py / run.ps1 a partir do .env (PHD_RUN_ROOT).
#   entrada:  /data/tiles  /data/aois  /data/annotations
#   saida:    /data/datasets  /data/experiments  /data/reports
# Os VRTs do AOI referenciam os tiles por /data/tiles (src-prefix do aoi_resolve).
services:
  phd-run:
    image: leucaena-segmentation:cuda
    working_dir: /workspace
    shm_size: "${DOCKER_SHM_SIZE:-8gb}"
    volumes:
      - ../..:/workspace
      - ${TILES_HOST}:/data/tiles
      - ${AOIS_HOST}:/data/aois
      - ${ANNOT_HOST}:/data/annotations
      - ${DATASETS_HOST}:/data/datasets
      - ${EXPERIMENTS_HOST}:/data/experiments
      - ${REPORTS_HOST}:/data/reports
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PROJ_LIB=/opt/conda/share/proj
      - GDAL_DATA=/opt/conda/share/gdal
      - GTIFF_SRS_SOURCE=EPSG
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
    command: bash
