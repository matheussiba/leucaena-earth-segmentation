services:
  segmentation:
    build: .
    image: leucaena-segmentation:cuda
    container_name: leucaena-segmentation
    working_dir: /workspace
    volumes:
      - .:/workspace
      # Tiles + masks live outside the OneDrive repo for performance/size.
      # Create D:\leucaena\rgbir and D:\leucaena\masks on the host before running.
      - D:/leucaena:/data
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
    command: bash
