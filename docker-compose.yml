services:
  segmentation:
    build: .
    image: leucaena-segmentation:cuda
    container_name: leucaena-segmentation
    working_dir: /workspace
    env_file:
      - .env
    volumes:
      - .:/workspace
      # WSL: use /mnt/g/... or /mnt/c/... in .env (not C:/...). Quotes needed if the path has spaces.
      - "${LEUCAENA_TILES_HOST_DIR}:/data/rgbir"
      - "${LEUCAENA_MASKS_HOST_DIR}:/data/masks"
      # LiDAR pipeline (optional; comment out the two lines below if you do not
      # have LAZ point clouds yet). Host paths come from .env.
      - "${LEUCAENA_LAZ_HOST_DIR}:/data/laz"
      - "${LEUCAENA_LIDAR_HOST_DIR}:/data/lidar"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PROJ_LIB=/opt/conda/share/proj
      - GDAL_DATA=/opt/conda/share/gdal
      - GTIFF_SRS_SOURCE=EPSG
      - LEUCAENA_TILES_DIR=${LEUCAENA_TILES_DIR}
      - LEUCAENA_MASKS_PATH=${LEUCAENA_MASKS_PATH}
      - LEUCAENA_LAZ_DIR=${LEUCAENA_LAZ_DIR}
      - LEUCAENA_LIDAR_DIR=${LEUCAENA_LIDAR_DIR}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
    command: bash
