services:
  segmentation:
    build: .
    image: leucaena-segmentation:cuda
    container_name: leucaena-segmentation
    working_dir: /workspace
    volumes:
      - .:/workspace
      # Tiles + masks on the local C: drive (edit paths if yours differ).
      - C:/Users/mathe/Downloads/rgbir:/data/rgbir
      - C:/Users/mathe/Downloads/leucaena-earth-data:/data/masks
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
    command: bash
