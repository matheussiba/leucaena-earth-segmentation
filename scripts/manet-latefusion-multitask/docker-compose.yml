# Compose isolado do experimento manet-latefusion-multitask.
# AOI_HOST e injetado pelos run_*.ps1 a partir do .env da raiz do repo
# (DIR_DATASETS_AI_PATH + LEUCAENA_DATASET_ID).
services:
  manet-latefusion-multitask:
    image: leucaena-segmentation:cuda
    working_dir: /workspace
    # PyTorch DataLoader workers precisam de /dev/shm maior que o default 64MB
    # Mais workers + patches 256 precisam de shm generoso (lab: 127 GB RAM)
    shm_size: "16gb"
    volumes:
      - ../..:/workspace
      - ${AOI_HOST}:/data/aoi
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PROJ_LIB=/opt/conda/share/proj
      - GDAL_DATA=/opt/conda/share/gdal
      - GTIFF_SRS_SOURCE=EPSG
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
    command: bash
