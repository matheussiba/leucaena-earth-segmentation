services:
  segmentation:
    build: .
    image: leucaena-segmentation:cuda
    container_name: leucaena-segmentation
    working_dir: /workspace
    env_file:
      - .env
    volumes:
      - .:/workspace
      # Host paths come from .env (see .env.example). Never commit .env.
      - ${LEUCAENA_TILES_HOST_DIR}:/data/rgbir
      - ${LEUCAENA_MASKS_HOST_DIR}:/data/masks
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - LEUCAENA_TILES_DIR=${LEUCAENA_TILES_DIR}
      - LEUCAENA_MASKS_PATH=${LEUCAENA_MASKS_PATH}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
    command: bash
